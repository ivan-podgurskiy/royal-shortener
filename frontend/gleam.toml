name = "frontend"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
rsvp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.html]
lang = "en"
title = "Royal Shortener"

[[tools.lustre.html.meta]]
name = "description"
content = "Royal Shortener takes long, unworthy URLs and crowns them as elegant links."

# Dev-server proxy: during `gleam run -m lustre/dev start` (port 1234) any
# request under /api is forwarded to the backend (port 8080), so the frontend
# can talk to the API from a single origin with live-reload intact.
#
# Short-link redirects (GET /:slug) are NOT proxied — they are served only by
# the backend. Short URLs therefore use localhost:8080 in dev (see
# ffi_ext.mjs `shortLinkOrigin`). Opening localhost:1234/<slug> hands off to
# :8080 before the SPA loads.
#
# In production the backend serves the bundle, API, and redirects from one port.
[tools.lustre.dev]
proxy = { from = "/api", to = "http://localhost:8080/api" }
